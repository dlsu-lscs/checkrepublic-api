# Routes every new issue in this repo to the "check republic" project board:
# https://github.com/orgs/dlsu-lscs/projects/21
#
# The Status column is NOT set here (the action cannot do that). It is set by the
# project's built-in workflow: project -> ... -> Workflows -> "Item added to project"
# -> Status: Ready. Configure that once; it covers every repo feeding the board.
#
# Secret ADD_TO_PROJECT_PAT: fine-grained PAT, org permission Projects: read/write,
# repo permissions Issues: read + Pull requests: read, scoped to this repo.
name: Add issue to project board

on:
  issues:
    types: [opened, reopened, transferred]

# The action authenticates with the PAT, so the default GITHUB_TOKEN needs nothing.
permissions: {}

jobs:
  add-to-project:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/add-to-project@v2
        with:
          project-url: https://github.com/orgs/dlsu-lscs/projects/21
          github-token: ${{ secrets.ADD_TO_PROJECT_PAT }}
